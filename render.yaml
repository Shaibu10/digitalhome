services:
  - type: web
    name: digitalhome
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
    healthCheckPath: /
    maxInstanceCount: 1

databases:
  - name: digitalhome-db
    databaseName: digitalhome
    plan: free
