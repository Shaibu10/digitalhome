services:
  - type: web
    name: digitalhome
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python init_db.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --worker-class gthread --timeout 60
    envVars:
      - key: PYTHON_VERSION
        value: "3.13"
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
