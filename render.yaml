services:
  - type: web
    name: digitalhome
    env: python
    plan: free
    pythonVersion: 3.13
    buildCommand: pip install -r requirements.txt
    # Database initialization happens in app.py create_app() function
    # Tables are created automatically when Flask app initializes
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --worker-class gthread --timeout 60
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      # Gmail Configuration (OAuth 2.0)
      - key: ENABLE_GMAIL
        value: "true"
      - key: GMAIL_ACCOUNT
        sync: false
      - key: SHOW_EMAIL_WARNINGS
        value: "false"
      # mNotify SMS Configuration
      - key: MNNOTIFY_API_KEY
        sync: false
      - key: MNNOTIFY_SENDER_ID
        value: DigitalHome
