services:
  - type: web
    name: digitalhome
    env: python
    plan: free
    pythonVersion: 3.13
    buildCommand: pip install -r requirements.txt
    # Database initialization happens in app.py create_app() function
    # Tables are created automatically when Flask app initializes
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --worker-class gthread --timeout 60
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      # Gmail Configuration
      - key: ENABLE_GMAIL
        value: "true"
      - key: GMAIL_ACCOUNT
        sync: false
      # mNotify SMS Configuration
      - key: MNNOTIFY_API_KEY
        sync: false
      - key: MNNOTIFY_SENDER_ID
        value: DigitalHome
      # Email Configuration
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USE_TLS
        value: "True"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: ENABLE_GMAIL
        value: "${ENABLE_GMAIL}"
      - key: SHOW_EMAIL_WARNINGS
        value: "false"
      - key: GOOGLE_SERVICE_ACCOUNT_FILE
        value: credentials.json
      - key: MNNOTIFY_API_KEY
        value: "${MNNOTIFY_API_KEY}"
      - key: MNNOTIFY_SENDER_ID
        value: DigitalHome
